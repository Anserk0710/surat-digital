name: Record P01 evidence

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: p01-evidence
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Record completed CI result
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/p01-record-ci.mjs

      - name: Commit evidence
        run: |
          if git diff --quiet -- docs/evidence/P01/verification.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/P01/verification.json
          git commit -m "docs(p01): record verified CI evidence"
          git push origin HEAD:main
